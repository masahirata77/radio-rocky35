plugins { id 'com.android.application' }
android {
    namespace 'com.rocky35.radio'
    compileSdk 37
    defaultConfig {
        applicationId 'com.rocky35.radio'
        minSdk 26
        targetSdk 37
        versionCode 20
        versionName '0.1.20'
    }
    packaging { resources { excludes += ['kotlin/**', 'META-INF/*.kotlin_module', 'META-INF/*.version'] } }
    buildTypes {
        // Versión que compila F-Droid: optimizada y sin firmar (F-Droid la firma con su clave).
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        optimized {
            initWith debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
