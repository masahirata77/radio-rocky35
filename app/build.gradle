plugins { id 'com.android.application' }
android {
    namespace 'com.rocky35.radio'
    compileSdk 37
    defaultConfig {
        applicationId 'com.rocky35.radio.kotlinpuro'
        minSdk 26
        targetSdk 37
        versionCode 6
        versionName '0.1.6'
    }
    packaging { resources { excludes += ['kotlin/**', 'META-INF/*.kotlin_module', 'META-INF/*.version'] } }
    buildTypes {
        optimized {
            initWith debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
