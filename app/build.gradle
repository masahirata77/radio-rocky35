plugins { id 'com.android.application' }
android {
    namespace 'com.rocky35.radio'
    compileSdk 37
    defaultConfig {
        applicationId 'com.rocky35.radio'
        minSdk 26
        targetSdk 37
        versionCode 6
        versionName '0.2.4'
    }
    buildTypes {
        optimized {
            initWith debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets { main { assets.srcDir file("build/generated/web-assets") } }
}
tasks.register('syncWeb', Sync) {
    from(rootProject.projectDir) { include 'index.html', 'app.js', 'stations.json' }
    into layout.buildDirectory.dir("generated/web-assets")
}
tasks.named('preBuild').configure { dependsOn 'syncWeb' }
