<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src http: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>Radio Rocky 35</title>
<style>
:root{color-scheme:dark;--bg:#101826;--panel:#1b2638;--line:#35445b;--ink:#f5f8ff;--muted:#b9c7da;--blue:#9bd5ff;--yellow:#ffd451}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;display:flex;flex-direction:column}
main{overflow-y:auto;min-height:0;flex:1;padding:18px clamp(14px,3vw,32px) 24px;overscroll-behavior:contain}.content{max-width:1120px;margin:auto}header{display:flex;align-items:center;gap:11px;margin-bottom:20px}.mark{display:grid;place-items:center;background:#164a9e;border-radius:13px;width:46px;height:46px;font-size:26px;color:white}.brand{font-weight:800;font-size:25px;letter-spacing:-.06em}.brand b{color:var(--yellow)}.sub{font-size:12px;color:var(--muted);letter-spacing:.045em}.tools{display:grid;gap:10px;grid-template-columns:1fr minmax(180px,260px);margin-bottom:16px}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:46px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input,select{padding:10px 12px;width:100%;min-width:0}input::placeholder{color:var(--muted)}.tabs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#0c1420;padding:4px;border-radius:14px}.tabs button{border:0;background:transparent;font-weight:650;color:var(--muted)}.tabs .active{background:#30486b;color:white}.summary{display:flex;justify-content:space-between;align-items:center;margin:3px 0 10px}.summary h1{font-size:18px;margin:0}.summary span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:9px}.station{display:flex;align-items:center;min-width:0;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:8px 9px}.station.current{border:2px solid var(--blue);padding:7px 8px}.station .play{display:flex;gap:12px;align-items:center;flex:1;text-align:left;min-width:0;background:none;border:0;padding:5px}.play-icon{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:#2b4160;color:var(--blue);font-size:18px}.station.current .play-icon{background:var(--blue);color:#102238}.station-name{min-width:0;display:grid;gap:4px}.station-name strong{font-size:15px;line-height:1.24;overflow-wrap:anywhere}.station-name small{font-size:12px;color:var(--muted)}.star{flex:none;border:0;background:none;width:45px;height:46px;font-size:27px;color:var(--muted);padding:0}.star[aria-pressed=true]{color:var(--yellow)}.player{flex:0 0 auto;background:#202e42;border-top:1px solid var(--line);padding:12px max(16px,calc((100vw - 1100px)/2)) calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}.now-row{display:flex;align-items:center;gap:12px;min-width:0}.toggle{width:50px;height:50px;border:0;background:var(--blue);color:#102238;border-radius:15px;font-size:21px;flex:none}.info{flex:1;min-width:0;display:grid;gap:4px}.info strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{font-size:12px;color:var(--muted)}.volume-row{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.volume-row input{flex:1;min-height:32px;padding:0;border:0;accent-color:var(--blue)}#vol-value{min-width:36px;text-align:right}.empty{padding:24px 10px;color:var(--muted)}@media(max-width:600px){main{padding:14px 12px 18px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:minmax(0,1fr)}header{margin-bottom:14px}.player{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}.summary h1{font-size:17px}.tabs button{min-height:42px}}
</style></head>
<body><main id="scroll"><div class="content"><header><div class="mark" aria-hidden="true">◉</div><div><div class="brand">Radio Rocky <b>35</b></div><div class="sub">RADIOS DE URUGUAY</div></div></header>
<div class="tools"><input id="search" type="search" placeholder="Buscar emisora…" aria-label="Buscar emisora"><select id="region" aria-label="Departamento"><option value="">Todos los departamentos</option></select><nav class="tabs" aria-label="Catálogo"><button type="button" id="tab-all" class="active" aria-pressed="true">Todas</button><button type="button" id="tab-fav" aria-pressed="false">★ Favoritas</button></nav></div>
<div class="summary"><h1 id="heading">Emisoras</h1><span id="count" role="status">Cargando…</span></div><section id="grid" class="grid" aria-label="Emisoras"></section></div></main>
<footer class="player"><div class="now-row"><button id="toggle" class="toggle" aria-label="Reproducir">▶</button><div class="info"><strong id="now">Elegí una emisora</strong><small id="status" role="status">Lista para escuchar</small></div><button id="player-fav" class="star" aria-label="Agregar a favoritas" aria-pressed="false" disabled>☆</button></div><label class="volume-row"><span>Volumen</span><input type="range" id="volume" min="0" max="1" step=".01" value=".65" aria-label="Volumen"><span id="vol-value">65%</span></label></footer>
<audio id="audio" preload="none"></audio><script src="app.js"></script></body></html>
