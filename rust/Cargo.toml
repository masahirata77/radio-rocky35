[package]
name = "rocky_radio"
version = "0.1.1"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
unicode-normalization = "0.1"
jni = "0.21.1"
[build-dependencies]
serde_json = "1"
unicode-normalization = "0.1"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
