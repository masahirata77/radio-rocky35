[package]
name = "rocky_radio"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
jni = "0.21.1"
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
